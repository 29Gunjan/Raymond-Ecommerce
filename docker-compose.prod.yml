# ============================================================
# Raymond E-Commerce — Production Docker Compose
# ============================================================
# Uses Neon PostgreSQL (external DB) — no local Postgres needed.
#
# Required env vars (set in .env file on EC2):
#   DOCKERHUB_USERNAME, DATABASE_URL, JWT_SECRET
# ============================================================

services:
  backend:
    image: ${DOCKERHUB_USERNAME:-gunja29}/raymond-backend:latest
    container_name: raymond-backend
    restart: on-failure
    env_file:
      - backend.env
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    networks:
      - raymond-network
    command: sh -c "npx prisma db push --skip-generate && node prisma/seed.js 2>/dev/null; node src/index.js"

  frontend:
    image: ${DOCKERHUB_USERNAME:-gunja29}/raymond-frontend:latest
    container_name: raymond-frontend
    restart: on-failure
    ports:
      - "3000:80"
    networks:
      - raymond-network
    depends_on:
      - backend

networks:
  raymond-network:
    driver: bridge
    name: raymond-network
