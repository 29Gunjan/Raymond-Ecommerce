# ============================================================
# Raymond E-Commerce — Production Docker Compose
# ============================================================
# This file pulls pre-built images from Docker Hub.
#
# USAGE:
#   1. Create a .env file with: DOCKERHUB_USERNAME=your-username
#   2. Run: docker compose -f docker-compose.prod.yml up -d
#
# IMPORTANT: Replace 'your-dockerhub-username' below with your
# actual Docker Hub username, OR set the DOCKERHUB_USERNAME
# environment variable.
# ============================================================

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: raymond-db
    environment:
      POSTGRES_USER: raymond
      POSTGRES_PASSWORD: raymond123
      POSTGRES_DB: raymond_ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - raymond-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raymond -d raymond_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/raymond-backend:latest
    container_name: raymond-backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://raymond:raymond123@postgres:5432/raymond_ecommerce
      JWT_SECRET: ${JWT_SECRET:-raymond-change-this-in-production}
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    networks:
      - raymond-network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sleep 5 && npx prisma db push --skip-generate && node prisma/seed.js 2>/dev/null; node src/index.js"

  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/raymond-frontend:latest
    container_name: raymond-frontend
    restart: on-failure
    ports:
      - "3000:80"
    networks:
      - raymond-network
    depends_on:
      - backend

networks:
  raymond-network:
    driver: bridge
    name: raymond-network

volumes:
  postgres_data:
