version: '3.8'

# Development configuration - Database only
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: raymond-db
    environment:
      POSTGRES_USER: raymond
      POSTGRES_PASSWORD: raymond123
      POSTGRES_DB: raymond_ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U raymond -d raymond_ecommerce" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
