version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: raymond-db
    environment:
      POSTGRES_USER: raymond
      POSTGRES_PASSWORD: raymond123
      POSTGRES_DB: raymond_ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U raymond -d raymond_ecommerce" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: raymond-backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://raymond:raymond123@postgres:5432/raymond_ecommerce
      JWT_SECRET: raymond-super-secret-jwt-key-change-in-production
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "sleep 5 && npx prisma db push --skip-generate && node prisma/seed.js 2>/dev/null; node src/index.js"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raymond-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
