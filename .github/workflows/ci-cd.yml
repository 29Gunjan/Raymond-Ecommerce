name: Build & Push to Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/raymond-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/raymond-frontend

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/raymond-ecommerce/"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SMTP_USER,SMTP_PASS,RAZORPAY_KEY_ID,RAZORPAY_KEY_SECRET,GROQ_API_KEY
          script: |
            cd /home/ubuntu/raymond-ecommerce

            # Stop and remove old Docker Postgres if it exists
            docker stop raymond-db 2>/dev/null || true
            docker rm raymond-db 2>/dev/null || true

            # Write backend.env with all secrets
            echo 'DATABASE_URL="'"${DATABASE_URL}"'"' > backend.env
            echo "JWT_SECRET=${JWT_SECRET}" >> backend.env
            echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" >> backend.env
            echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" >> backend.env
            echo "FRONTEND_URL=http://ec2-13-218-33-14.compute-1.amazonaws.com" >> backend.env
            echo "SMTP_HOST=smtp.gmail.com" >> backend.env
            echo "SMTP_PORT=587" >> backend.env
            echo "SMTP_USER=${SMTP_USER}" >> backend.env
            echo "SMTP_PASS=${SMTP_PASS}" >> backend.env
            echo "FROM_EMAIL=${SMTP_USER}" >> backend.env
            echo "FROM_NAME=Raymond Store" >> backend.env
            echo "RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}" >> backend.env
            echo "RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}" >> backend.env
            echo "GROQ_API_KEY=${GROQ_API_KEY}" >> backend.env

            # Pull and deploy (Neon DB — no local Postgres)
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f
            echo "Deployed successfully!"
